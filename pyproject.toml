[project]
name = "wordle-solver"
version = "0.1.0"
description = "A NYT Wordle solver: a TypeSafe-driven browser agent specialized for Wordle"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Nathan Drezner", email = "nathan.drezner@langchain.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.1",
    "langchain-core>=1.6.3",
    "langchain-typesafe>=0.0.1a2",
    "playwright>=1.63.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
